<style>
:root{
  /* Layout idea: a phone home screen is the table of contents; each "app" opens one lesson screen. */
  --bg:#14112a;--surface:#1f1a3d;--surface2:#2a2452;--line:#3b3468;
  --text:#f5f2ff;--muted:#b9b1dc;--accent:#ff6fae;
  --good:#4fd37a;--warn:#ffc23d;--bad:#ff5d66;--info:#6db3ff;
  --display:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background-color:var(--bg);color:var(--text);
  font:400 17px/1.55 var(--body);-webkit-text-size-adjust:100%;
  background-image:radial-gradient(900px 520px at 90% -8%,rgba(255,111,174,.2),transparent 60%),radial-gradient(700px 520px at -10% 18%,rgba(109,179,255,.15),transparent 60%);
  background-repeat:no-repeat;
}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 72px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--info);outline-offset:3px;border-radius:10px}
.eyebrow{font:600 13px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font-size:clamp(42px,12vw,64px);font-weight:800;letter-spacing:-.03em;margin:14px 0 14px}
h1 em{font-style:normal;color:var(--accent)}
.lead{color:var(--muted);font-size:18px;max-width:46ch}

/* mantra */
.mantra{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 30px;padding:0;list-style:none}
.mantra li{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 8px;font-weight:700;font-size:15px}
.mantra b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#2a0a1a;font-size:13px}

/* home screen */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:8px;text-decoration:none;text-align:center;position:relative}
.ico{display:grid;place-items:center;border-radius:24%;box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.ico svg{width:52%;height:52%;filter:drop-shadow(0 1px 2px rgba(0,0,0,.25))}
.tile .ico{width:min(25vw,92px);height:min(25vw,92px);transition:transform .15s}
.tile:hover .ico,.tile:active .ico{transform:scale(.94)}
.tile span.lbl{font-weight:700;font-size:15px}
.tile small{display:block;color:var(--muted);font-size:12.5px;line-height:1.25;margin-top:-4px}
.badge{position:absolute;top:-6px;right:calc(50% - min(12.5vw,46px) - 6px);width:26px;height:26px;border-radius:50%;background:var(--good);color:#06240f;display:grid;place-items:center;font-weight:800;font-size:15px;border:3px solid var(--bg)}
.progress{margin:34px 0 0;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.progress .row{display:flex;justify-content:space-between;gap:12px;font-weight:700;margin-bottom:10px}
.bar{height:8px;background:var(--line);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:8px;transition:width .35s}
.award{margin-top:14px;padding:14px;border-radius:14px;background:rgba(79,211,122,.14);border:1px solid var(--good);font-weight:700}
.foot{margin-top:30px;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:10px}
.foot a{color:var(--text);font-weight:700}

/* module screen */
.back{display:inline-block;text-decoration:none;font-weight:700;color:var(--muted);padding:6px 0;margin-bottom:10px}
.back:hover{color:var(--text)}
.mtitle{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.mtitle .ico{width:64px;height:64px;flex:none}
.mtitle h2{font-size:clamp(34px,9vw,44px);font-weight:800;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:16px}
.chip{display:inline-block;min-height:0;margin:0 0 14px;font-weight:700;font-size:14px;color:var(--good)}
.chip:empty{display:none}
.mod-lead{font-size:19px;margin:0 0 22px;color:var(--text)}
.sect{font-size:13px;font:700 13px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
.cards{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.info{border-left:5px solid var(--info)}
.info.good{border-left-color:var(--good)}
.info.warn{border-left-color:var(--warn)}
.info.bad{border-left-color:var(--bad)}
.info h3{font-size:20px;margin-bottom:6px}
.info p,.info li{color:#e3def8}
.info ul,.info ol{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.tip{margin-top:30px;background:linear-gradient(135deg,rgba(255,111,174,.22),rgba(139,92,246,.22));border:1px solid rgba(255,111,174,.55);border-radius:18px;padding:16px}
.tip b{display:block;font:800 13px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.tip p{font-size:19px;font-weight:600}
.zones{display:grid;gap:12px}
.zone{border-radius:18px;padding:14px 16px;border:1.5px solid}
.zone h3{font-size:19px;margin-bottom:6px}
.zone ul{margin:0;padding-left:20px;display:grid;gap:3px}
.zone.z-g{border-color:var(--good);background:rgba(79,211,122,.1)}
.zone.z-y{border-color:var(--warn);background:rgba(255,194,61,.1)}
.zone.z-r{border-color:var(--bad);background:rgba(255,93,102,.1)}
.zone small{display:block;margin-top:8px;color:var(--muted)}

/* buttons */
.btn{font:700 16px/1 var(--body);background:var(--accent);color:#2a0a1a;border:0;border-radius:14px;padding:14px 18px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}

/* game */
.game{background:var(--surface2);border-radius:20px;padding:18px;margin-top:6px}
.game + .game{margin-top:18px}
.game-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.tag{font:800 13px/1.2 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.count{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.game .bar{margin-bottom:16px}
.game .intro{color:var(--muted);margin-bottom:12px;font-size:16px}
.q{font-size:20px;font-weight:600;line-height:1.35;margin-bottom:16px}
.opts{display:grid;gap:10px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{display:block;width:100%;text-align:left;background:var(--surface);color:var(--text);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font:600 16px/1.35 var(--body);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.t-good{box-shadow:inset 5px 0 0 var(--good)}
.opt.t-warn{box-shadow:inset 5px 0 0 var(--warn)}
.opt.t-bad{box-shadow:inset 5px 0 0 var(--bad)}
.opt.right{border-color:var(--good);background:rgba(79,211,122,.16)}
.opt.wrong{border-color:var(--bad);background:rgba(255,93,102,.16)}
.fb{margin-top:14px}
.fb .box{padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.fb strong{display:block;margin-bottom:4px;font-size:18px}
.fb .ok strong{color:var(--good)}
.fb .no strong{color:var(--bad)}
.fb .btn{margin-top:12px}
.result{text-align:center;padding:8px 0}
.result .big{font:800 56px/1 var(--display);color:var(--accent);font-variant-numeric:tabular-nums;margin:6px 0 8px}
.result p{margin-bottom:14px}
.review{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0 0 16px}
.review a{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 14px;text-decoration:none;font-weight:700;font-size:15px}
.review a:hover{border-color:var(--accent)}

/* copy box, contacts */
.copybox{background:var(--surface);border:1px dashed var(--accent);border-radius:16px;padding:14px;margin-top:12px}
.copybox p{font-size:17px;margin-bottom:12px}
.contacts{display:grid;gap:10px}
.contact{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.contact .num{font:800 26px/1 var(--display);color:var(--accent);min-width:92px;font-variant-numeric:tabular-nums}
.contact small{color:var(--muted);display:block;font-size:14px;line-height:1.35}
.contact b{display:block}

/* dohoda */
.pledges{display:grid;gap:8px}
.pledge{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1.5px solid var(--line);color:var(--text);border-radius:14px;padding:12px 14px;font:500 16px/1.4 var(--body);cursor:pointer}
.pledge .box{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;font-weight:800;color:transparent;margin-top:1px}
.pledge[aria-checked="true"]{border-color:var(--good);background:rgba(79,211,122,.12)}
.pledge[aria-checked="true"] .box{background:var(--good);border-color:var(--good);color:#06240f}
label.f{display:block;font-weight:700;margin:0 0 6px}
input[type=text]{width:100%;font:500 17px var(--body);color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{width:100%;min-height:300px;font:500 15px/1.5 var(--body);color:var(--text);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;resize:vertical}
.row-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.note{color:var(--muted);font-size:15px;margin-top:10px}

/* parent */
details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0}
details + details{margin-top:10px}
summary{cursor:pointer;list-style:none;padding:14px 16px;font:700 17px/1.3 var(--body);display:flex;gap:10px;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;color:var(--accent);flex:none}
details[open] summary::after{content:"–"}
.dbody{padding:0 16px 16px;color:#e3def8}
.dbody ul{margin:8px 0 0;padding-left:20px;display:grid;gap:4px}
.dbody p + p{margin-top:8px}

@media (max-width:380px){.opts.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="wrap" id="app"></div>

<script>
(function(){
"use strict";

/* ---------- helpers ---------- */
function h(tag,props){
  var e=document.createElement(tag);
  if(props){for(var k in props){var v=props[k];
    if(k==="class")e.className=v;
    else if(k==="html")e.innerHTML=v;
    else if(k.slice(0,2)==="on")e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(k,v);}}
  var kids=[].slice.call(arguments,2);
  (function add(list){list.forEach(function(c){
    if(c==null||c===false)return;
    if(Array.isArray(c))return add(c);
    e.append(c.nodeType?c:document.createTextNode(c));
  });})(kids);
  return e;
}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function copyText(text,btn){
  var old=btn.textContent;
  var done=function(msg){btn.textContent=msg;setTimeout(function(){btn.textContent=old;},2200);};
  try{navigator.clipboard.writeText(text).then(function(){done("Skopírované ✓");},function(){done("Označ text a skopíruj ručne");});}
  catch(e){done("Označ text a skopíruj ručne");}
}

/* ---------- state ---------- */
var KEY="dg-sprievodca-v1";
var state={parts:{},dohoda:{name:"",kid:[],par:[]}};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function load(){try{var s=localStorage.getItem(KEY);return s?JSON.parse(s):null;}catch(e){return null;}}

/* ---------- icons ---------- */
var ICONS={
  ai:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/>',
  appky:'<path d="M12 4v10m0 0l-4-4m4 4l4-4"/><path d="M5 19h14"/>',
  spravy:'<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5"/>',
  pravda:'<circle cx="11" cy="11" r="6"/><path d="M16 16l5 5"/><path d="M8.5 11l1.8 1.8 3.2-3.6"/>',
  hesla:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/><path d="M12 15v2"/>',
  pohoda:'<path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/>',
  sos:'<path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z"/><path d="M9 12l2 2 4-4"/>',
  dohoda:'<path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4"/><path d="M9.5 14.5l2 2 3.5-4"/>',
  kviz:'<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9 6.8 19.7l1-5.9L3.5 9.7l5.9-.8z"/>'
};
function icon(m,size){
  var s=h("span",{class:"ico",style:(size?"width:"+size+"px;height:"+size+"px;":"")+"background:linear-gradient(145deg,"+m.grad[0]+","+m.grad[1]+")"});
  s.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[m.id]+'</svg>';
  return s;
}

/* ---------- progress ---------- */
function mark(id,n){state.parts[id+":"+n]=true;save();var m=MODS.filter(function(x){return x.id===id;})[0];var el=document.getElementById("status-"+id);if(el&&isDone(m))el.textContent="✓ Hotovo";}
function isDone(m){for(var i=0;i<m.parts;i++){if(!state.parts[m.id+":"+i])return false;}return true;}

/* ---------- reusable pieces ---------- */
function sect(t){return h("h3",{class:"sect"},t);}
function cards(list){
  return h("div",{class:"cards"},list.map(function(c){
    return h("article",{class:"card info "+(c.tone||"")},
      h("h3",null,c.t),
      c.ol?h("ol",null,c.ol.map(function(x){return h("li",null,x);})):
      Array.isArray(c.d)?h("ul",null,c.d.map(function(x){return h("li",null,x);})):h("p",null,c.d));
  }));
}
function tip(t){return h("div",{class:"tip"},h("b",null,"Zapamätaj si"),h("p",null,t));}
function copybox(label,text){
  var btn=h("button",{class:"btn ghost",type:"button"},"Skopírovať");
  btn.addEventListener("click",function(){copyText(text,btn);});
  return h("div",{class:"copybox"},h("p",null,"„"+text+"“"),btn);
}
function head(m){
  return h("header",null,
    h("a",{class:"back",href:"#"},"‹ Domov"),
    h("div",{class:"mtitle"},icon(m),h("div",null,h("h2",null,m.name),h("p",{class:"sub"},m.sub))),
    h("p",{class:"chip",id:"status-"+m.id,"aria-live":"polite"},isDone(m)?"✓ Hotovo":""));
}

/* chooser: one question at a time, instant feedback */
function chooser(cfg){
  var root=h("section",{class:"card game","aria-label":cfg.title});
  var order,i,score,wrongs;
  function start(){order=shuffle(cfg.items.slice());i=0;score=0;wrongs=[];ask();}
  function ask(){
    root.replaceChildren();
    var it=order[i];
    var opts=it.opts?shuffle(it.opts.slice()):cfg.opts;
    root.append(
      h("div",{class:"game-head"},h("span",{class:"tag"},cfg.title),h("span",{class:"count"},(i+1)+" / "+order.length)),
      h("div",{class:"bar"},h("i",{style:"width:"+(i/order.length*100)+"%"})));
    if(cfg.intro&&i===0)root.append(h("p",{class:"intro"},cfg.intro));
    root.append(h("p",{class:"q"},it.q));
    var short=opts.length===2&&opts.every(function(o){return o.label.length<=24;});
    var box=h("div",{class:"opts"+(short?" two":"")});
    var fb=h("div",{class:"fb",role:"status","aria-live":"polite"});
    var btns=[];
    opts.forEach(function(o){
      var b=h("button",{class:"opt"+(o.tone?" t-"+o.tone:""),type:"button"},o.label);
      b.addEventListener("click",function(){pick(o,b);});
      btns.push({b:b,o:o});box.append(b);
    });
    function pick(o,b){
      var ok=o.id===it.a;
      if(ok)score++;else wrongs.push(it);
      btns.forEach(function(x){x.b.disabled=true;if(x.o.id===it.a)x.b.classList.add("right");});
      if(!ok)b.classList.add("wrong");
      var correctLabel=opts.filter(function(x){return x.id===it.a;})[0].label;
      var next=h("button",{class:"btn",type:"button"},i+1<order.length?"Ďalej":"Hotovo");
      next.addEventListener("click",function(){i++;if(i<order.length)ask();else finish();});
      fb.append(h("div",{class:"box "+(ok?"ok":"no")},
        h("strong",null,ok?(cfg.yes||"Správne!"):(cfg.no||"Skoro. Správne je: "+correctLabel)),
        h("p",null,it.why),next));
      next.focus();
    }
    root.append(box,fb);
  }
  function finish(){
    root.replaceChildren();
    var tot=order.length,r=score/tot;
    var msg=r>=0.85?"Skvelé, toto už vieš.":r>=0.6?"Dobrá práca, ešte pár vecí si zopakuj.":"Žiadna hanba. Prejdi si kapitoly a skús znova.";
    root.append(h("div",{class:"result"},
      h("span",{class:"tag"},cfg.title),
      h("div",{class:"big"},score+" / "+tot),
      h("p",null,msg),
      cfg.review?cfg.review(wrongs):null,
      h("button",{class:"btn",type:"button",onclick:start},"Skúsiť znova")));
    if(cfg.onDone)cfg.onDone(score,tot,wrongs);
  }
  start();
  return root;
}

/* ---------- content: yes/no option sets ---------- */
var OPT_GOOD_BAD=[{id:"ok",label:"Dobrý nápad",tone:"good"},{id:"no",label:"Zlý nápad",tone:"bad"}];

/* ---------- module: AI ---------- */
function buildAI(m){
  var items=[
    {q:"Požiadaš AI: „Vysvetli mi zlomky na príklade s pizzou.“",a:"ok",why:"Presne na toto je dobrá. Vysvetlí ti to inak a ty tomu porozumieš."},
    {q:"AI napíše celé slohové zadanie a ty ho odovzdáš ako svoje.",a:"no",why:"Nič sa nenaučíš a učitelia to často spoznajú. Nech ti AI pomôže s osnovou a text napíš sama."},
    {q:"Napíšeš AI svoje celé meno, školu a adresu, aby ti „lepšie pomohla“.",a:"no",why:"Na pomoc s úlohou to nepotrebuje. Čo napíšeš, môže zostať uložené."},
    {q:"Odpoveď od AI si overíš v učebnici alebo na ďalšom zdroji.",a:"ok",why:"Toto je najlepší návyk. AI sa mýli aj vtedy, keď znie úplne isto."},
    {q:"AI ti má poradiť, aký liek užiť, keď ťa bolí brucho.",a:"no",why:"Zdravie patrí rodičom a lekárom. AI nevidí teba ani tvoju situáciu."},
    {q:"Požiadaš AI, aby ťa vyskúšala z tvojich zápiskov.",a:"ok",why:"Výborný tréning. Ty si aktívna a AI je len tvoj skúšajúci."},
    {q:"Pomocou AI vyrobíš fotku spolužiačky v trápnej situácii „len pre srandu“.",a:"no",why:"Pre ňu to nie je sranda. Je to šikana a môže to byť aj trestné."},
    {q:"Povieš AI, že ti je smutno, a necháš ju ako jedinú kamarátku.",a:"no",why:"AI takmer vždy súhlasí a nič necíti. Keď je ti ťažko, hovor s človekom, ktorému na tebe záleží."},
    {q:"Necháš si od AI poradiť nápady na projekt, jeden si vyberieš a urobíš ho po svojom.",a:"ok",why:"AI na nápady, ty na rozhodnutie a prácu. Takto to má fungovať."}
  ];
  var prompt="Som žiačka základnej školy. Nevyriešuj to za mňa. Vysvetli mi to krok za krokom jednoduchými slovami a na konci mi daj podobný príklad na precvičenie.";
  return h("div",null,head(m),
    h("p",{class:"mod-lead"},"AI chatbot je ako neuveriteľne rýchly spolužiak, ktorý prečítal polovicu internetu. Vie pomôcť, ale občas si s úplne istým výrazom vymyslí hlúposť."),
    cards([
      {t:"Čo AI vlastne robí",d:"Skladá slová tak, aby výsledok znel pravdepodobne. Nevie, čo je pravda. Preto si vie vymyslieť fakty, mená aj zdroje a pritom znieť presvedčivo."},
      {t:"Na čo je dobrá",tone:"good",d:["Vysvetliť učivo inak, než ho vysvetlili v škole","Dať ti príklady na precvičenie","Vyskúšať ťa z tvojich zápiskov","Nápady na projekt alebo plán učenia"]},
      {t:"Na čo nie je",tone:"bad",d:["Robiť úlohy za teba (a ty sa nič nenaučíš)","Radiť ti so zdravím alebo s tým, keď ti je ťažko","Rozhodovať namiesto teba"]},
      {t:"Súkromné veci",tone:"bad",d:"Nikdy jej neposielaj celé meno, adresu, školu, telefónne číslo, heslá ani fotky svoje či kamarátov. Čo jej pošleš, môže zostať uložené."},
      {t:"Falošné fotky, videá a hlasy",tone:"warn",d:"AI vie vyrobiť fotku, video aj hlas, ktoré vyzerajú ako skutočné. Preto nie všetko, čo vidíš a počuješ, je pravda. A falošné fotky spolužiakov nie sú žart. Je to šikana a môže to byť aj trestné."},
      {t:"Vekové limity",tone:"warn",d:"Mnohé AI appky majú limit 13+ alebo aj 18+. AI „kamaráti“, s ktorými sa rozpráva ako s človekom, nie sú pre deti. Používaj AI spolu s rodičom a len v appkách, ktoré schváli rodič."}
    ]),
    sect("Čarovná veta"),
    h("p",{class:"note",style:"margin:0 0 4px"},"Takto poprosíš AI o pomoc, nie o hotové riešenie:"),
    copybox("",prompt),
    sect("Hra"),
    chooser({title:"Dobrý alebo zlý nápad?",intro:"Rozhodni, či je to dobrý spôsob, ako použiť AI.",opts:OPT_GOOD_BAD,items:items,onDone:function(){mark(m.id,0);}}),
    tip("AI je pomocník, nie šéf. Overuj, premýšľaj a rozhoduj ty."));
}

/* ---------- module: Appky ---------- */
function buildAppky(m){
  var perms=[
    {q:"Appka „Baterka“ chce prístup ku kontaktom a mikrofónu.",a:"n",why:"Baterka nepotrebuje tvoje kontakty ani mikrofón. Takto sa zbierajú údaje."},
    {q:"Mapová appka chce tvoju polohu, kým ju používaš.",a:"y",why:"Mapy bez polohy nefungujú. Vyber „len pri používaní appky“, nie „vždy“."},
    {q:"Jednoduchá hra na kreslenie chce prístup ku všetkým tvojim fotkám a polohe.",a:"n",why:"Na kreslenie to nepotrebuje. Ak niečo nedáva zmysel, zamietni."},
    {q:"Appka na videohovory s rodinou chce kameru a mikrofón.",a:"y",why:"Toto dáva zmysel. Bez nich by hovor nefungoval."},
    {q:"Kalkulačka chce tvoju polohu.",a:"n",why:"Kalkulačka nepotrebuje vedieť, kde si. Zamietni."},
    {q:"Appka na fotenie chce prístup ku kamere.",a:"y",why:"Logické. Appka robí fotky, tak kameru potrebuje."}
  ];
  var traps=[
    {q:"Hra je „zadarmo“. Po 10 minútach vyskočí: „Kúp 100 diamantov za 4,99 €, aby si pokračovala.“",a:"trap",why:"Takto hry zarábajú. O nákupoch rozhodujú rodičia, nie ty."},
    {q:"Appka za 2,99 €. Jednorazová platba, žiadne reklamy a žiadne nákupy. Kúpi ju rodič.",a:"ok",why:"Jasná cena a jasné pravidlá. Toto je v poriadku."},
    {q:"„Získaj 10 000 Robux zadarmo. Stačí zadať svoje meno a heslo!“",a:"trap",why:"Podvod. Stránka ti ukradne účet. Herná mena zadarmo takto neexistuje."},
    {q:"Prvých 7 dní je zadarmo, potom sa ti automaticky strháva 9,99 € mesačne.",a:"trap",why:"Na toto ľudia zabúdajú. O skúšobných verziách rozhoduje rodič a zrušenie si treba pripomenúť."},
    {q:"Vyskakovacie okno: „Tvoj telefón je napadnutý vírusom! Stiahni túto appku na vyčistenie.“",a:"trap",why:"Falošné varovanie, aby si stiahla škodlivú appku. Zavri a povedz to rodičovi."},
    {q:"Školská appka, ktorú ti odporučila učiteľka a prezrel ju rodič.",a:"ok",why:"Dospelí ju poznajú a vedia, čo robí. V poriadku."},
    {q:"V hre si môžeš kúpiť „tajomný balíček“ s náhodnými vecami za skutočné peniaze.",a:"trap",why:"Nevieš, čo dostaneš, a môžeš minúť veľa peňazí. Je to podobné hazardu."}
  ];
  return h("div",null,head(m),
    h("p",{class:"mod-lead"},"Obchod s appkami vyzerá ako cukráreň. Nie všetko, čo sa blyští, je zadarmo, a nie všetko je pre teba."),
    cards([
      {t:"Len z oficiálneho obchodu",d:"App Store alebo Google Play. Nikdy nie z odkazu v správe, z reklamy alebo zo stránky, ktorá sľubuje „všetko zadarmo“. Práve tam sa skrývajú vírusy a podvody."},
      {t:"Najprv ukáž rodičovi",d:"Nie preto, že ti neveria. Dospelý vidí veci, ktoré ty ešte nevidíš: skryté platby, vekový limit aj cudzích ľudí v chate."},
      {t:"„Zadarmo“ často nie je zadarmo",tone:"warn",d:["Platíš reklamami, ktoré musíš pozerať","Platíš svojimi údajmi, ktoré appka zbiera","Platíš nákupmi v hre, ktoré ťa lákajú","Platíš predplatným, ktoré sa po skúšobnej dobe samo strháva","Ak neplatíš peniazmi, často je produktom tvoja pozornosť a tvoje dáta."]},
      {t:"Vek 13+",tone:"warn",d:"TikTok, Instagram, Snapchat, Discord aj WhatsApp majú v Európe minimálny vek 13 rokov. Nie je to formalita. Keď pri registrácii zadáš nepravdivý vek, appka ti môže ukazovať obsah pre starších a dovoliť cudzím ľuďom, aby ti písali."},
      {t:"Detektívny test pred stiahnutím",ol:["Kto appku vyrobil? Je to známa firma?","Čo hovoria recenzie? Prečítaj tie s 1 až 2 hviezdičkami.","Koľko to naozaj stojí? Sú tam nákupy v appke?","Aké povolenia chce? Dáva to zmysel?","Je appka určená pre môj vek?"]}
    ]),
    sect("Ktoré appky sú v poriadku"),
    h("div",{class:"zones"},
      h("div",{class:"zone z-g"},h("h3",null,"Zelená: zvyčajne v poriadku (s rodičom)"),
        h("ul",null,h("li",null,"Učenie a tvorenie: Scratch, Khan Academy, jazykové appky"),h("li",null,"Mapy, kalkulačka, hodiny, fotoaparát"),h("li",null,"YouTube Kids")),
        h("small",null,"Vždy si pozri vekové označenie priamo v obchode.")),
      h("div",{class:"zone z-y"},h("h3",null,"Žltá: len s rodičom a po nastavení"),
        h("ul",null,h("li",null,"Hry s online chatom, napr. Roblox alebo Fortnite"),h("li",null,"YouTube s vlastným účtom"),h("li",null,"Hry s nákupmi v hre")),
        h("small",null,"Spolu s rodičom vypnite chat s cudzími a nákupy bez schválenia.")),
      h("div",{class:"zone z-r"},h("h3",null,"Červená: zatiaľ nie"),
        h("ul",null,h("li",null,"TikTok, Instagram, Snapchat, Discord, WhatsApp (oficiálne 13+)"),h("li",null,"AI „kamaráti“ a chatbot-postavy"),h("li",null,"Anonymné chaty, zoznamky a „zdieľanie polohy“ s cudzími"))
      )),
    sect("Hra 1"),
    chooser({title:"Povoliť alebo zamietnuť?",intro:"Appka vyskočí s otázkou o povolení. Čo spravíš?",opts:[{id:"y",label:"Povoliť",tone:"good"},{id:"n",label:"Zamietnuť",tone:"bad"}],items:perms,onDone:function(){mark(m.id,0);}}),
    sect("Hra 2"),
    chooser({title:"Pasca na peniaze?",intro:"Rozpoznaj, kde ťa niekto chce obrať o peniaze alebo účet.",opts:[{id:"trap",label:"Pasca",tone:"bad"},{id:"ok",label:"V poriadku",tone:"good"}],items:traps,onDone:function(){mark(m.id,1);}}),
    tip("Ak nie si si istá, nesťahuj. Najprv sa opýtaj."));
}

/* ---------- module: Správy ---------- */
function buildSpravy(m){
  var OPTS=[{id:"g",label:"Zelená: v pohode",tone:"good"},{id:"y",label:"Žltá: najprv sa opýtaj",tone:"warn"},{id:"r",label:"Červená: radšej nikdy",tone:"bad"}];
  var sem=[
    {q:"Meme, ktorý ťa rozosmial, do chatu s kamoškami.",a:"g",why:"V pohode, ak nikoho neuráža."},

    {q:"Tvoj feed ti stále ukazuje podobné videá. Prečo?",a:"a",mod:"pohoda",opts:o("Algoritmus ukazuje to, čo ťa udrží pri obrazovke","Takto vyzerá celý internet","Je to náhoda"),why:"Appky ukazujú to, čo ťa udrží dlhšie. Nie to, čo je pre teba najlepšie."}

  return h("div",null,head(m),
    h("p",{class:"mod-lead"},"Desať otázok z celého sprievodcu. Ukáž, čo vieš, a získaj odznak."),
    chooser({title:"Záverečný kvíz",opts:[],items:items,yes:"Správne!",

      },

    d("Núdzové kódové slovo",[

      h("p",null,"Funguje aj vtedy, keď je u kamarátky.")],true),
    d("Pravidelný 10-minútový rozhovor",[

    sect("Nastavenia a nástroje"),
    d("Rodičovská kontrola a schvaľovanie",[

    d("Nákupy v hrách a lootboxy",[
      h("p",null,"Zablokujte nákupy bez schválenia. Skontrolujte, či v telefóne nie je uložená platobná karta. Vysvetlite jej, že nákupy v hre môžu vyjsť na desiatky eur."),
      h("p",null,"Pozor na chat v hrách (napríklad Roblox). Vypnite alebo obmedzte chat s cudzími.")]),

    d("Poloha a zdieľanie",[
      h("p",null,"Ak zdieľate polohu, urobte to otvorene a s dôvodom. Vypnite pripisovanie polohy do fotiek. Pomôžte jej nastaviť súkromné profily, ak nejaké má.")]),
    sect("Rozhovory, na ktoré sa oplatí pripraviť"),
    d("Vekové limity a falošný vek",[
      h("p",null,"Väčšina sociálnych sietí (TikTok, Instagram, Snapchat, Discord) má v Európe minimálny vek 13 rokov. WhatsApp ho po pôvodných 16 znížil na 13. Ak dieťa zadá nepravdivý vek, appka s ním zaobchádza ako s dospelým."),

    d("Nevhodný obsah, ktorý nehľadala",[

    d("AI a deepfaky medzi deťmi",[

    d("Fotky dieťaťa na internete",[
      h("p",null,"Opýtajte sa jej, než jej fotku zverejníte. Vyhnite sa fotkám v školskej uniforme a s lokalitou. Deti sa učia podľa vášho správania.")]),
    sect("Koho zapojiť a kde hľadať pomoc"),

/* ---------- home ---------- */
function buildHome(){
  var done=MODS.filter(isDone).length,tot=MODS.length;
  var grid=h("nav",{class:"grid","aria-label":"Kapitoly"},MODS.map(function(m){
    return h("a",{class:"tile",href:"#"+m.id,"aria-label":m.name+(isDone(m)?" (hotovo)":"")},
      icon(m),
      isDone(m)?h("span",{class:"badge","aria-hidden":"true"},"✓"):null,
      h("span",{class:"lbl"},m.name));
  }));
  return h("div",null,
    h("p",{class:"eyebrow"},"Digitálny sprievodca"),
    h("h1",null,"Tvoj telefón. ",h("em",null,"Tvoje pravidlá.")),
    h("p",{class:"lead"},"Pár minút na každú kapitolu. Žiadna prednáška, len veci, ktoré ti ušetria problémy. Klikni na appku a vyskúšaj hry."),
    h("ul",{class:"mantra","aria-label":"Tri kroky"},
      h("li",null,h("b",null,"1"),"Zastav"),
      h("li",null,h("b",null,"2"),"Zamysli sa"),
      h("li",null,h("b",null,"3"),"Over")),
    grid,
    h("div",{class:"progress"},
      h("div",{class:"row"},h("span",null,"Tvoj postup"),h("span",null,done+" z "+tot)),
      h("div",{class:"bar",role:"progressbar","aria-valuemin":"0","aria-valuemax":String(tot),"aria-valuenow":String(done)},h("i",{style:"width:"+(done/tot*100)+"%"})),
      done===tot?h("div",{class:"award"},"Odznak získaný: Digitálny detektív. Gratulujem!"):null),
    h("div",{class:"foot"},
      h("a",{href:"#rodic"},"Pre rodiča: na čo ešte myslieť ›"),
      h("span",null,"Táto stránka nezbiera žiadne tvoje údaje a nič nenačítava z iných serverov. Postup sa ukladá len v tvojom prehliadači."),h("span",null,"Všeobecné informácie pre rodiny, ktoré nenahrádzajú odbornú pomoc. Vekové limity a nastavenia appiek sa menia, over si ich v obchode s appkami. Vytvorené s pomocou AI (Claude).")));
}

/* ---------- modules + router ---------- */
var MODS=[
  {id:"ai",name:"AI",sub:"Skvelý pomocník, hrozný šéf",grad:["#8b5cf6","#d946ef"],parts:1,build:buildAI},
  {id:"appky",name:"Appky",sub:"Čo stiahnuť a čo nie",grad:["#2563eb","#22d3ee"],parts:2,build:buildAppky},
  {id:"spravy",name:"Správy",sub:"Kamošky, chat a hranice",grad:["#16a34a","#84cc16"],parts:2,build:buildSpravy},
  {id:"pravda",name:"Pravda?",sub:"Ako si overiť, čo vidíš",grad:["#f97316","#ec4899"],parts:1,build:buildPravda},
  {id:"hesla",name:"Heslá",sub:"Zámok na tvoj svet",grad:["#4f46e5","#38bdf8"],parts:1,build:buildHesla},
  {id:"pohoda",name:"Pohoda",sub:"Feed, spánok a porovnávanie",grad:["#0d9488","#3b82f6"],parts:1,build:buildPohoda},
  {id:"sos",name:"SOS",sub:"Keď sa niečo stane",grad:["#e11d48","#fb7185"],parts:1,build:buildSos},
  {id:"kviz",name:"Kvíz",sub:"Ukáž, čo vieš",grad:["#f59e0b","#ef4444"],parts:1,build:buildKviz}
];
var app=document.getElementById("app");
function route(){
  var id=(location.hash||"").replace("#","");
  var m=MODS.filter(function(x){return x.id===id;})[0];
  app.replaceChildren();
  if(id==="rodic")app.append(buildParent());
  else if(m)app.append(m.build(m));
  else app.append(buildHome());
  window.scrollTo(0,0);
}
function start(data){
  var saved=(data&&data.parts)?data:load();
  if(saved){state.parts=saved.parts||{};state.dohoda=Object.assign({name:"",kid:[],par:[]},saved.dohoda||{});}
  window.addEventListener("hashchange",route);
  route();
}
var hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(function(){return state;});
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
})();
